	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap">
	</noscript>
	<style>
		.bl,
		.label,
		.modal h2,
		.modal h3 {
			font-family: 'Bebas Neue', Impact, 'Arial Narrow', Arial, sans-serif
		}

		#tooltip,
		.contact-row a,
		.course-group ul li,
		.modal,
		.proj-desc,
		.proj-link {
			font-family: 'Space Mono', 'Courier New', Courier, monospace
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		:root {
			--red: #e03020;
			--cream: #f0ece3
		}

		body,
		html {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #0a0a0a
		}

		body {
			cursor: none
		}

		#app {
			position: relative;
			width: 100dvw;
			height: 100dvh
		}

		#bg-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 0
		}

		#three-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 1;
			pointer-events: none
		}

		#crt-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 2;
			pointer-events: none
		}

		#overlay {
			position: absolute;
			inset: 0;
			pointer-events: none;
			font-family: 'Bebas Neue', sans-serif;
			z-index: 3
		}

		.label {
			position: absolute;
			color: var(--cream);
			text-shadow: 1px 1px 0 #000, -1px -1px 0 #000
		}

		a.label {
			text-decoration: none;
			pointer-events: all;
			transition: color .2s
		}

		a.label:hover {
			color: var(--red)
		}

		.tl {
			top: 4vh;
			left: 4vw;
			font-size: clamp(1rem, 3.5vw, 2.8rem);
			letter-spacing: .04em;
			animation: .4s both fadeIn
		}

		.tr {
			top: 4vh;
			right: 4vw;
			font-size: clamp(1.2rem, 4.5vw, 3.8rem);
			letter-spacing: .06em;
			text-align: right;
			animation: .4s both fadeIn
		}

		.sl {
			left: 3vw;
			top: 50%;
			transform: translateY(-50%) rotate(-90deg);
			font-size: clamp(.65rem, 1.6vw, 1.3rem);
			letter-spacing: .16em;
			white-space: nowrap;
			font-family: 'Space Mono', 'Courier New', Courier, monospace;
			animation: 1s .4s both fadeIn
		}

		.sr {
			right: 3vw;
			top: 50%;
			transform: translateY(-50%) rotate(90deg);
			font-size: clamp(.65rem, 1.6vw, 1.3rem);
			letter-spacing: .16em;
			white-space: nowrap;
			font-family: 'Space Mono', 'Courier New', Courier, monospace;
			animation: 1s .5s both fadeIn
		}

		.bl-wrap {
			position: absolute;
			bottom: 3vh;
			left: 0;
			right: 0;
			display: flex;
			justify-content: center;
			pointer-events: none;
			z-index: 4
		}

		.bl {
			font-family: 'Bebas Neue', sans-serif;
			font-size: clamp(1rem, 3vw, 2.4rem);
			letter-spacing: .1em;
			display: flex;
			align-items: center;
			gap: clamp(.6rem, 2.5vw, 2rem);
			white-space: nowrap;
			pointer-events: all;
			opacity: 0;
			animation: 1s .7s forwards blIn
		}

		.bl a {
			color: var(--cream);
			text-decoration: none;
			text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
			border-bottom: 2px solid transparent;
			padding-bottom: 2px;
			transition: color .2s, border-color .2s
		}

		.bl a:hover {
			color: var(--red);
			border-color: var(--red)
		}

		.bl .sep {
			color: var(--cream);
			opacity: .4;
			text-shadow: 1px 1px 0 #000
		}

		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(8px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes blIn {
			from {
				opacity: 0
			}

			to {
				opacity: 1
			}
		}

		#cursor {
			position: fixed;
			width: 10px;
			height: 10px;
			background: var(--red);
			border-radius: 50%;
			pointer-events: none;
			z-index: 9999;
			mix-blend-mode: difference;
			transform: translate(-50%, -50%);
			transition: width .2s, height .2s
		}

		#cursor.big {
			width: 40px;
			height: 40px
		}

		#tooltip {
			position: fixed;
			pointer-events: none;
			z-index: 10000;
			background: rgba(10, 10, 10, .92);
			border: 1px solid var(--red);
			color: var(--cream);
			font-family: 'Space Mono', monospace;
			font-size: .7rem;
			letter-spacing: .04em;
			padding: .35em .6em;
			max-width: 220px;
			white-space: normal;
			line-height: 1.4;
			opacity: 0;
			transition: opacity .15s;
			transform: translate(18px, -50%)
		}

		#tooltip.visible {
			opacity: 1
		}

		.modal-backdrop {
			display: none;
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, .78);
			z-index: 5000;
			align-items: center;
			justify-content: center;
			backdrop-filter: blur(4px)
		}

		.modal-backdrop.open {
			display: flex
		}

		.modal {
			position: relative;
			background: #0f0f0f;
			border: 1px solid #2a2a2a;
			border-top: 2px solid var(--red);
			color: var(--cream);
			font-family: 'Space Mono', monospace;
			width: min(520px, 92vw);
			max-height: 82vh;
			overflow-y: auto;
			padding: 2rem 2rem 1.8rem;
			animation: .22s both modalIn;
			scrollbar-width: thin;
			scrollbar-color: var(--red) #1a1a1a
		}

		.modal::-webkit-scrollbar {
			width: 5px
		}

		.modal::-webkit-scrollbar-track {
			background: #1a1a1a
		}

		.modal::-webkit-scrollbar-thumb {
			background: var(--red)
		}

		@keyframes modalIn {
			from {
				opacity: 0;
				transform: translateY(14px) scale(.97)
			}

			to {
				opacity: 1;
				transform: translateY(0) scale(1)
			}
		}

		.modal-close {
			position: absolute;
			top: .9rem;
			right: 1rem;
			background: 0 0;
			border: none;
			color: var(--cream);
			font-size: 1.3rem;
			cursor: none;
			opacity: .6;
			transition: opacity .15s, color .15s
		}

		.modal-close:hover {
			opacity: 1;
			color: var(--red)
		}

		.modal h2 {
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.8rem;
			letter-spacing: .08em;
			color: var(--red);
			margin-bottom: 1.4rem
		}

		.modal h3 {
			font-family: 'Bebas Neue', sans-serif;
			font-size: 1.1rem;
			letter-spacing: .1em;
			color: var(--cream);
			border-bottom: 1px solid #222;
			padding-bottom: .3rem;
			margin: 1.4rem 0 .7rem
		}

		.modal h3:first-of-type {
			margin-top: 0
		}

		.proj-item {
			display: flex;
			flex-direction: column;
			gap: .15rem;
			padding: .5rem 0;
			border-bottom: 1px solid #181818
		}

		.proj-item:last-child {
			border-bottom: none
		}

		.proj-link {
			color: var(--cream);
			text-decoration: none;
			font-size: .78rem;
			letter-spacing: .04em;
			transition: color .15s
		}

		.proj-link:hover {
			color: var(--red)
		}

		.proj-desc {
			font-size: .65rem;
			color: #888;
			letter-spacing: .02em;
			line-height: 1.5
		}

		.course-group {
			margin-bottom: .8rem
		}

		.course-group-title {
			color: var(--red);
			font-size: .78rem;
			letter-spacing: .05em;
			margin-bottom: .35rem;
			text-decoration: none;
			display: inline-block;
			border-bottom: 1px solid var(--red);
			transition: opacity .15s
		}

		.course-group-title:hover {
			opacity: .75
		}

		.course-group ul {
			list-style: none;
			padding-left: .8rem
		}

		.course-group ul li {
			padding: .28rem 0;
			border-bottom: 1px solid #181818;
			font-size: .72rem
		}

		.course-group ul li:last-child {
			border-bottom: none
		}

		.course-group ul li a {
			color: var(--cream);
			text-decoration: none;
			transition: color .15s
		}

		.course-group ul li a:hover {
			color: var(--red)
		}

		.contact-grid {
			display: flex;
			flex-direction: column;
			gap: .6rem;
			margin-top: .4rem
		}

		.contact-row {
			display: flex;
			align-items: center;
			gap: 1rem;
			padding: .55rem .8rem;
			border: 1px solid #1e1e1e;
			transition: border-color .15s
		}

		.contact-row:hover {
			border-color: var(--red)
		}

		.contact-row a {
			color: var(--cream);
			text-decoration: none;
			font-size: .78rem;
			letter-spacing: .06em;
			transition: color .15s
		}

		.contact-row a:hover {
			color: var(--red)
		}

		.contact-icon {
			width: 18px;
			flex-shrink: 0;
			opacity: .7
		}
	</style>
</head>
